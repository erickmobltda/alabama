<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unidade 05 3D Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D stage with a drafting-table side panel; panel drops to a bottom sheet on phones */
:root{
  --bg:#e3e7e2; --scene:#dde2dc; --panel:#f6f7f4; --ink:#1c2320; --muted:#5b6560; --line:#d0d6d0;
  --accent:#c9561a; --accent-ink:#ffffff; --sel:#1d6aa8; --approx:#b97e0c; --wall:#f2f1ec; --slab:#c4cac2;
  --conduit:#d4a017; --c-power:#b83a4b; --c-comm:#2f7f86; --grid:#bcc3bb; --danger:#b3261e; --field:#ffffff;
  --font-d:'Saira Condensed','Arial Narrow',sans-serif;
  --font-b:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#181c1a; --scene:#1c211f; --panel:#212624; --ink:#e5eae6; --muted:#9aa49e; --line:#343b37;
  --accent:#ee7a3a; --accent-ink:#1a0f08; --sel:#5aa6e6; --approx:#e2aa3c; --wall:#c7cac2; --slab:#48504b;
  --conduit:#e9bd3c; --c-power:#ec7d8d; --c-comm:#57b8bf; --grid:#323935; --danger:#f2867c; --field:#2a302d; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#181c1a; --scene:#1c211f; --panel:#212624; --ink:#e5eae6; --muted:#9aa49e; --line:#343b37;
  --accent:#ee7a3a; --accent-ink:#1a0f08; --sel:#5aa6e6; --approx:#e2aa3c; --wall:#c7cac2; --slab:#48504b;
  --conduit:#e9bd3c; --c-power:#ec7d8d; --c-comm:#57b8bf; --grid:#323935; --danger:#f2867c; --field:#2a302d; color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:14px;overflow:hidden}
#app{display:flex;height:100%;min-height:0}
#stage{position:relative;flex:1 1 auto;min-width:0;min-height:0;background:var(--scene)}
#cv{display:block;width:100%;height:100%;touch-action:none;outline:none}
#panel{flex:0 0 340px;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
@media (max-width:760px){
  #app{flex-direction:column}
  #stage{flex:1 1 55%}
  #panel{flex:0 0 45%;border-left:0;border-top:1px solid var(--line)}
}

/* toolbar */
#toolbar{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:12px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}
.tgroup{display:flex;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:8px;pointer-events:auto;box-shadow:0 1px 3px rgb(0 0 0 / .08)}
.tbtn{font:600 13px/1 var(--font-d);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:transparent;border:0;border-radius:6px;padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn kbd{font:400 10px var(--font-m);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 4px}
.tbtn:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tbtn[aria-pressed="true"] kbd{color:var(--panel);border-color:color-mix(in srgb,var(--panel) 40%,transparent)}
.tbtn:disabled{opacity:.35;cursor:default;background:transparent}
.tbtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.tbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

#status{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
#hint{font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;max-width:100%}
#readout{font:12px var(--font-m);font-variant-numeric:tabular-nums;background:var(--ink);color:var(--panel);border-radius:6px;padding:6px 10px}
#readout:empty{display:none}

/* panel */
#panel header{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
#panel h1{font:700 26px/1 var(--font-d);letter-spacing:.02em;margin:0;text-transform:uppercase}
#panel header p{margin:6px 0 0;color:var(--muted);font-size:12.5px}
#panel header p.store{font:12px var(--font-m);display:flex;align-items:center;gap:6px}
.store::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.store[data-s="ok"]::before{background:#3f9b57}.store[data-s="busy"]::before{background:var(--conduit)}.store[data-s="err"]::before{background:var(--danger)}.store[data-s="ro"]::before{background:var(--sel)}
.scroll{overflow-y:auto;min-height:0;flex:1 1 auto}
section.blk{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.eyebrow{font:600 12px/1 var(--font-d);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label,.chk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.slider{display:grid;grid-template-columns:92px 1fr 64px;align-items:center;gap:8px;font-size:13px}
.slider output{font:12px var(--font-m);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
.tab{font:600 14px/1 var(--font-d);letter-spacing:.06em;text-transform:uppercase;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:12px 10px 10px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
.ins-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.ins-head h2{font:600 20px/1.1 var(--font-d);margin:0;text-wrap:balance}
.kind{font:600 11px/1 var(--font-d);letter-spacing:.12em;text-transform:uppercase;color:var(--panel);background:var(--ink);padding:3px 6px;border-radius:3px}
.badge{font:500 11px/1 var(--font-m);color:var(--approx);border:1px solid var(--approx);border-radius:3px;padding:2px 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld span{font-size:11.5px;color:var(--muted)}
.fld.full{grid-column:1/-1}
input[type=number],input[type=text],select,textarea{font:13px var(--font-m);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:5px;padding:6px 7px;min-width:0;width:100%;box-sizing:border-box}
input[type=text]{font-family:var(--font-b)}
textarea{min-height:120px;resize:vertical;font-size:11.5px}
h3{font:600 15px/1 var(--font-d);letter-spacing:.06em;text-transform:uppercase;margin:6px 0 0}
.op{border:1px solid var(--line);border-radius:6px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.op .top{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.op .top select{width:auto}
.op .top .sp{flex:1}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{font:600 13px/1 var(--font-d);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:6px;padding:8px 10px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.sm{padding:5px 7px;font-size:12px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.muted{color:var(--muted);font-size:12.5px;line-height:1.5;margin:0}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:13px var(--font-b);color:var(--ink);cursor:pointer;width:100%}
.li:first-child{border-top:0}
.li:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.li .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .num{font:12px var(--font-m);color:var(--muted);font-variant-numeric:tabular-nums}
.sw{width:10px;height:10px;border-radius:2px;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:6px;padding:8px}
.stat b{display:block;font:500 18px var(--font-m);font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
ul.notes{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px;line-height:1.5;display:flex;flex-direction:column;gap:4px}
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--ink);color:var(--panel);font-size:13px;padding:8px 12px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" tabindex="0" aria-label="3D model of Unidade 05"></canvas>
    <div id="toolbar">
      <div class="tgroup" role="toolbar" aria-label="Tools">
        <button class="tbtn" data-tool="select" title="Select and drag boxes"><svg viewBox="0 0 16 16"><path d="M3 2l9 5-4 1-1 4z"/></svg>Select<kbd>V</kbd></button>
        <button class="tbtn" data-tool="wall" title="Draw walls: click start, click end"><svg viewBox="0 0 16 16"><path d="M2 12h12M2 9h12M5 9v3M11 9v3M8 6v3M2 6h12"/></svg>Wall<kbd>W</kbd></button>
        <button class="tbtn" data-tool="box" title="Place junction box on a wall"><svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8"/></svg>Box<kbd>B</kbd></button>
        <button class="tbtn" data-tool="ceil" title="Place a ceiling box (light point): click a spot on the active floor"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5"/><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>Ceiling<kbd>L</kbd></button>
        <button class="tbtn" data-tool="conduit" title="Connect two boxes"><svg viewBox="0 0 16 16"><rect x="1.5" y="10.5" width="4" height="4"/><rect x="10.5" y="1.5" width="4" height="4"/><path d="M3.5 10.5V3.5h7"/></svg>Conduit<kbd>C</kbd></button>
      </div>
      <div class="tgroup" role="group" aria-label="Floor being edited">
        <button class="tbtn" data-floor="0">Térreo</button>
        <button class="tbtn" data-floor="1">Superior</button>
      </div>
      <div class="tgroup" role="group" aria-label="Transform selected wall">
        <button class="tbtn" id="gMove" title="Move selected wall">Move<kbd>G</kbd></button>
        <button class="tbtn" id="gRot" title="Rotate selected wall">Rotate<kbd>R</kbd></button>
        <button class="tbtn" id="bDel" title="Delete selection">Delete</button>
      </div>
      <div class="tgroup" role="group" aria-label="History and camera">
        <button class="tbtn" id="bUndo" title="Undo (Ctrl+Z)">Undo</button>
        <button class="tbtn" id="bRedo" title="Redo (Ctrl+Shift+Z)">Redo</button>
        <button class="tbtn" data-cam="iso">3D</button>
        <button class="tbtn" data-cam="top">Top</button>
        <button class="tbtn" data-cam="front">Street</button>
      </div>
    </div>
    <div id="status"><div id="hint"></div><div id="readout"></div></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>

  <aside id="panel" aria-label="Model panel">
    <header>
      <h1>Unidade 05</h1>
      <p>Two-floor townhouse · lot 4,96 × 16,95 m · dimensions in cm</p>
      <p id="store" class="store" role="status"></p>
    </header>
    <div class="scroll">
      <section class="blk" aria-label="View">
        <p class="eyebrow">View</p>
        <div class="checks">
          <label><input type="checkbox" id="vG" checked> Térreo</label>
          <label><input type="checkbox" id="vU" checked> Superior</label>
          <label><input type="checkbox" id="vExt" checked> Exterior walls</label>
          <label><input type="checkbox" id="vRoof"> Roof slab</label>
          <label><input type="checkbox" id="vLabels" checked> Labels</label>
          <label><input type="checkbox" id="vApprox" checked> Mark approximate</label>
        </div>
        <div class="slider"><label for="hG">Térreo walls</label><input type="range" id="hG" min="200" max="400" step="5"><output id="hGo"></output></div>
        <div class="slider"><label for="hU">Superior walls</label><input type="range" id="hU" min="200" max="400" step="5"><output id="hUo"></output></div>
        <div class="slider"><label for="hCut">Wall cut</label><input type="range" id="hCut" min="10" max="100" step="1"><output id="hCuto"></output></div>
        <div class="legend"><span><i style="background:var(--wall);border:1px solid var(--line)"></i>Wall</span><span><i style="background:var(--approx)"></i>Approximate</span><span><i style="background:var(--sel)"></i>Selected</span><span><i style="background:var(--accent)"></i>Box</span><span><i style="background:var(--c-power)"></i>Power</span><span><i style="background:var(--conduit)"></i>Lighting</span><span><i style="background:var(--c-comm)"></i>Communication</span></div>
      </section>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="ins" aria-selected="true">Inspector</button>
        <button class="tab" role="tab" data-tab="rooms" aria-selected="false">Rooms</button>
        <button class="tab" role="tab" data-tab="elec" aria-selected="false">Electrical</button>
        <button class="tab" role="tab" data-tab="data" aria-selected="false">Data</button>
      </div>
      <div id="pane" class="pane"></div>
    </div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/TransformControls.js"></script>
<script>
(function(){
'use strict';
const KEY='unidade05-model-v1';
const $=s=>document.querySelector(s);
const rid=p=>p+Math.random().toString(36).slice(2,8);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r1=v=>Math.round(v*10)/10;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- State ---------- */
function emptyModel(){return {version:2,floors:[{name:'Térreo',height:290},{name:'Superior',height:280}],slab:12,slabs:{},stair:null,rooms:[],walls:[],boxes:[],conduits:[]};}
let S=emptyModel();
const DATA_FILE='house.json';
// Used only to migrate files saved before walls had an "exterior" flag: party walls and front/back façades
const DEFAULT_EXTERIOR=['g1','g2','g3','g14','u1','u2','u3','u22','u23','u24','u25'];
const store={mode:'none',state:'',msg:'',timer:null,lastSaved:'',local:false};
const view={ctype:{power:true,lighting:true,communication:true},show:[true,true],exterior:true,roof:false,labels:true,approx:true,cut:1,edit:0,tool:'select',gizmo:null,tab:'ins'};
let sel=null; // {kind,id}
const undoStack=[],redoStack=[];
function pushUndo(){undoStack.push(JSON.stringify(S));if(undoStack.length>120)undoStack.shift();redoStack.length=0;syncHistory();}
function undo(){if(!undoStack.length)return;redoStack.push(JSON.stringify(S));S=JSON.parse(undoStack.pop());afterLoad();toast('Undone');}
function redo(){if(!redoStack.length)return;undoStack.push(JSON.stringify(S));S=JSON.parse(redoStack.pop());afterLoad();toast('Redone');}
function afterLoad(){if(sel&&!getSel())sel=null;syncControls();refresh();save();}
// Compact JSON: one key per line, numeric arrays on one line, so git diffs stay readable
function fmtJSON(o){return JSON.stringify(o,null,2).replace(/\[\s+([-\d.,\s]+?)\s+\]/g,(m,inner)=>'['+inner.split(/,\s*/).map(x=>x.trim()).join(', ')+']')+'\n';}
function save(){
  if(store.mode==='file'){clearTimeout(store.timer);setStore('saving');store.timer=setTimeout(saveToFile,500);return;}
  store.local=true; // read-only copy: changes live only in this tab
  setStore();
}
async function saveToFile(){
  const json=fmtJSON(S);
  if(json===store.lastSaved){setStore('saved');return;}
  try{
    const r=await fetch('api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({json,md:buildMd(false)})});
    if(!r.ok)throw new Error((await r.text())||('HTTP '+r.status));
    store.lastSaved=json;setStore('saved');
  }catch(e){setStore('error',e.message);toast('Could not save house.json');}
}
function setStore(state,msg){
  if(state!==undefined){store.state=state;store.msg=msg||'';}
  const el=document.getElementById('store');if(!el)return;
  let t,c='';
  if(store.mode==='file'){t=store.state==='saving'?'Saving to house.json…':store.state==='error'?'Not saved: '+store.msg:'Saved to house.json';c=store.state==='error'?'err':store.state==='saving'?'busy':'ok';}
  else if(store.mode==='static'){t=store.local?'Read-only · changes in this tab are not saved':'Showing the published house.json';c='ro';}
  else{t='Open through the server: node server.js, then http://127.0.0.1:8000';c='err';}
  el.textContent=t;el.dataset.s=c;
}
window.addEventListener('beforeunload',e=>{if(store.mode==='file'&&store.state==='saving'){e.preventDefault();e.returnValue='';}});
async function boot(){
  let fileData=null,server=false;
  try{const r=await fetch(DATA_FILE,{cache:'no-store'});if(r.ok){const o=await r.json();if(valid(o))fileData=o;}}catch(e){}
  try{const r=await fetch('api/status',{cache:'no-store'});if(r.ok){const j=await r.json();server=!!j.ok;}}catch(e){}
  if(server){
    store.mode='file';
    if(fileData){S=normalize(fileData);store.lastSaved=fmtJSON(S);}
    store.state='saved';
  }else{
    store.mode=fileData?'static':'none';
    if(fileData)S=normalize(fileData);
  }
  try{localStorage.removeItem(KEY);}catch(e){} // older versions kept browser copies; house.json is the only source now
  setStore();syncControls();refresh();
  if(store.mode==='none')toast(location.protocol==='file:'?'Browsers cannot read house.json from file://. Run "node server.js" and open http://127.0.0.1:8000':'house.json not found next to index.html');
}
function valid(o){return o&&Array.isArray(o.walls)&&Array.isArray(o.floors)&&o.floors.length===2;}
function normalize(o){
  if(!Array.isArray(o.rooms))o.rooms=[];
  if(!o.slabs||typeof o.slabs!=='object')o.slabs=(S&&S.slabs)||{};
  if(o.stair===undefined)o.stair=(S&&S.stair)||null;
  o.version=2;
  o.rooms.forEach(r=>{r.id=r.id||rid('r');r.floor=r.floor?1:0;r.name=r.name||'Room';r.area=r.area||'';r.x=+r.x||0;r.y=+r.y||0;r.bounds=Array.isArray(r.bounds)&&r.bounds.length===4?r.bounds.map(Number):[r.x-50,r.y-50,r.x+50,r.y+50];});
  o.slab=+o.slab||12; o.boxes=Array.isArray(o.boxes)?o.boxes:[]; o.conduits=Array.isArray(o.conduits)?o.conduits:[];
  o.walls.forEach(w=>{w.id=w.id||rid('w');w.floor=w.floor?1:0;['x1','y1','x2','y2'].forEach(k=>w[k]=+w[k]||0);w.t=+w.t||10;w.h=(w.h===null||w.h===undefined||w.h==='')?null:+w.h;w.type=w.type==='glass'?'glass':'wall';w.openings=Array.isArray(w.openings)?w.openings:[];w.name=w.name||'Wall';
    w.openings.forEach(p=>{p.id=p.id||rid('o');p.kind=p.kind==='window'?'window':'door';['offset','width','height','sill'].forEach(k=>p[k]=+p[k]||0);});});
  const hasExt=o.walls.some(w=>'exterior' in w);
  o.walls.forEach(w=>{w.exterior=hasExt?!!w.exterior:DEFAULT_EXTERIOR.includes(w.id);});
  const wids=new Set(o.walls.map(w=>w.id));
  o.boxes.forEach(b=>{b.mount=b.mount==='ceiling'?'ceiling':'wall';b.kind=BOX_KINDS[b.kind]?b.kind:'other';b.circuit=b.circuit==null?'':String(b.circuit);b.approx=!!b.approx;
    if(b.mount==='ceiling'){b.floor=b.floor?1:0;b.x=+b.x||0;b.y=+b.y||0;}else{b.along=+b.along||0;b.z=+b.z||0;b.side=b.side===-1?-1:1;}});
  o.boxes=o.boxes.filter(b=>b.mount==='ceiling'||wids.has(b.wallId));

function placeOnWall(b,h){

function onClick(e){
  const t=view.tool;

    if(!sel||sel.kind!=='wall')view.gizmo=null;

  }

  }

function connect(a,b){

function deleteSel(){
  if(!sel)return;pushUndo();
  if(sel.kind==='wall'){const gone=new Set(S.boxes.filter(b=>b.wallId===sel.id).map(b=>b.id));S.walls=S.walls.filter(w=>w.id!==sel.id);S.boxes=S.boxes.filter(b=>!gone.has(b.id));S.conduits=S.conduits.filter(c=>!gone.has(c.a)&&!gone.has(c.b));}
  else if(sel.kind==='room')S.rooms=S.rooms.filter(r=>r.id!==sel.id);
  else if(sel.kind==='box'){S.boxes=S.boxes.filter(b=>b.id!==sel.id);S.conduits=S.conduits.filter(c=>c.a!==sel.id&&c.b!==sel.id);}
  else S.conduits=S.conduits.filter(c=>c.id!==sel.id);
  sel=null;view.gizmo=null;save();refresh();toast('Deleted');
}

    if(['x','y','x0','y0','x1','y1'].includes(f)&&isNaN(n))return renderPanel();
    pushUndo();
    if(f==='name')r.name=v.trim()||'Room';
    else if(f==='area')r.area=v.trim();
    else if(f==='floor')r.floor=+v;
    else if(f==='x'||f==='y')r[f]=r1(n);
    else r.bounds[{x0:0,y0:1,x1:2,y1:3}[f]]=r1(n);
  } else if(sc==='conduit'){
    const c=conById(el.dataset.id);if(!c)return;pushUndo();
    if(f==='type')c.type=v;
    else if(f==='mode'){if(v==='custom'){if(c.mode!=='custom')materialize(c);}else c.mode=v;}
  } else if(sc==='joint'){
    const c=conById(el.dataset.id),p=c&&c.points[+el.dataset.i];if(!p||isNaN(n))return renderPanel();
    pushUndo();p[f]=r1(n);
  } else if(sc==='ctype'){
    view.ctype[f]=v;refresh();return;
  }
  save();refresh();
});
pane.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a!=='clear-elec')clearArm=false;
  const w=sel&&sel.kind==='wall'?wallById(sel.id):null;
  if(a==='add-door'||a==='add-window'){if(!w)return;pushUndo();const G=geom(w),door=a==='add-door';
    w.openings.push({id:rid('o'),kind:door?'door':'window',offset:r1(G.L/2),width:door?80:100,height:door?210:120,sill:door?0:90,approx:false,note:''});save();refresh();}
  else if(a==='del-open'){const ww=wallById(b.dataset.w);if(!ww)return;pushUndo();ww.openings=ww.openings.filter(p=>p.id!==b.dataset.id);save();refresh();}
  else if(a==='flip'){if(!w)return;pushUndo();const G=geom(w);[w.x1,w.y1,w.x2,w.y2]=[w.x2,w.y2,w.x1,w.y1];w.openings.forEach(p=>p.offset=r1(G.L-p.offset));S.boxes.filter(x=>x.wallId===w.id).forEach(x=>{x.along=r1(G.L-x.along);x.side=-x.side;});save();refresh();}
  else if(a==='gizmo-move'){view.gizmo=view.gizmo==='translate'?null:'translate';refresh();}
  else if(a==='gizmo-rot'){view.gizmo=view.gizmo==='rotate'?null:'rotate';refresh();}
  else if(a==='del')deleteSel();
  else if(a==='sel-box'){sel={kind:'box',id:b.dataset.id};focusBox(sel.id);setTab('ins');refresh();}
  else if(a==='sel-conduit'){sel={kind:'conduit',id:b.dataset.id};focusConduit(sel.id);setTab('ins');refresh();}
  else if(a==='sel-room'){sel={kind:'room',id:b.dataset.id};focusRoom(sel.id);setTab('ins');refresh();}
  else if(a==='focus-room'){focusRoom(b.dataset.id);refresh();}
  else if(a==='center-label'){const r=sel&&sel.kind==='room'&&roomById(sel.id);if(!r)return;pushUndo();r.x=r1((r.bounds[0]+r.bounds[2])/2);r.y=r1((r.bounds[1]+r.bounds[3])/2);save();refresh();}
  else if(a==='add-room'){pushUndo();const f=view.edit,r={id:rid('r'),floor:f,name:'New room',area:'',x:248,y:800,bounds:[198,750,298,850]};S.rooms.push(r);sel={kind:'room',id:r.id};ensureFloor(f);focusRoom(r.id);setTab('ins');save();refresh();}
  else if(a==='copy-md'){const t=$('#mdOut');try{navigator.clipboard.writeText(t.value).then(()=>toast('Markdown copied'),()=>{t.select();toast('Press Ctrl+C to copy');});}catch(err){t.select();toast('Press Ctrl+C to copy');}}
  else if(a==='clear-elec'){if(!clearArm){clearArm=true;renderPanel();return;}clearArm=false;pushUndo();S.boxes=[];S.conduits=[];if(sel&&sel.kind!=='wall')sel=null;save();refresh();toast('Electrical layout cleared');}
  else if(a==='copy'){const t=$('#exp');const ok=()=>toast('JSON copied');
    try{navigator.clipboard.writeText(t.value).then(ok,()=>{t.select();toast('Press Ctrl+C to copy');});}catch(err){t.select();toast('Press Ctrl+C to copy');}}
  else if(a==='import'){importText($('#imp').value);}
  else if(a==='add-joint'){const c=conById(b.dataset.id);if(!c)return;pushUndo();if(c.mode!=='custom')materialize(c);
    const pts=conduitPts(c);let bi=1,bl=-1;for(let i=1;i<pts.length;i++){const d=pts[i].distanceTo(pts[i-1]);if(d>bl){bl=d;bi=i;}}
    const m=pts[bi-1].clone().add(pts[bi]).multiplyScalar(.5);c.points.splice(bi-1,0,{x:r1(m.x),y:r1(m.z),z:r1(m.y)});save();refresh();}
  else if(a==='del-joint'){const c=conById(b.dataset.id);if(!c)return;pushUndo();c.points.splice(+b.dataset.i,1);save();refresh();}
  else if(a==='reset-path'){const c=conById(b.dataset.id);if(!c)return;pushUndo();c.mode='orthogonal';c.points=[];save();refresh();}
  else if(a==='reload-file'){fetch(DATA_FILE,{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(o=>{if(!valid(o))throw 0;pushUndo();S=normalize(o);store.lastSaved=fmtJSON(S);sel=null;syncControls();refresh();setStore('saved');toast('Reloaded house.json');}).catch(()=>toast('Could not read house.json'));}
  else if(a==='download-json'){const url=URL.createObjectURL(new Blob([fmtJSON(S)],{type:'application/json'}));const l=document.createElement('a');l.href=url;l.download='house.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}

});

/* ---------- Keyboard ---------- */
window.addEventListener('keydown',e=>{
  const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&k==='y'){e.preventDefault();redo();return;}
  if(mod)return;
  if(k==='escape'){if(wallStart||conA){wallStart=null;conA=null;preview.visible=false;hint();}else if(view.gizmo){view.gizmo=null;refresh();}else if(sel){sel=null;refresh();}}
  else if(k==='delete'||k==='backspace'){if(sel){e.preventDefault();deleteSel();}}
  else if(k==='v')setTool('select');else if(k==='w')setTool('wall');else if(k==='b')setTool('box');else if(k==='l')setTool('ceil');else if(k==='c')setTool('conduit');
  else if(k==='g'&&sel&&sel.kind==='wall'){view.gizmo=view.gizmo==='translate'?null:'translate';refresh();}
  else if(k==='r'&&sel&&sel.kind==='wall'){view.gizmo=view.gizmo==='rotate'?null:'rotate';refresh();}
});

/* ---------- Misc ---------- */
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),1600);}
function resize(){const r=stage.getBoundingClientRect();if(!r.width||!r.height)return;renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);
const onTheme=()=>{readTheme();rebuild3D();};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',onTheme);}catch(e){}
new MutationObserver(onTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{texCache.forEach(t=>t.dispose());texCache.clear();rebuild3D();});

readTheme();syncControls();camPreset('iso');setTool('select');refresh();resize();boot();
(function loop(){requestAnimationFrame(loop);
  if(anim){const k=clamp((performance.now()-anim.t0)/anim.dur,0,1),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    controls.target.lerpVectors(anim.ft,anim.tt,e);camera.position.lerpVectors(anim.fp,anim.tp,e);if(k>=1)anim=null;}
  controls.update();renderer.render(scene,camera);})();
})();
</script>
